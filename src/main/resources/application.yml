server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  profiles:
    default: prod
  application:
    name: url-shortener
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DATABASE_USERNAME:shortener}
    password: ${DATABASE_PASSWORD:shortener}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: db,ping
        liveness:
          include: ping

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache-ttl: ${CACHE_TTL:PT1H}
  api-key: ${API_KEY}
  api-key-pepper: ${API_KEY_PEPPER}
  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:100}
    window: ${RATE_LIMIT_WINDOW:PT1M}
  redirect-rate-limit:
    requests: ${REDIRECT_RATE_LIMIT_REQUESTS:600}
    window: ${REDIRECT_RATE_LIMIT_WINDOW:PT1M}
  analytics-retention: ${ANALYTICS_RETENTION:P365D}
  expired-url-retention: ${EXPIRED_URL_RETENTION:P30D}
  cleanup-batch-size: ${CLEANUP_BATCH_SIZE:500}
  cleanup-cron: ${CLEANUP_CRON:0 0 3 * * *}
  trusted-proxies: ${TRUSTED_PROXIES:}
  allowed-destination-hosts: ${ALLOWED_DESTINATION_HOSTS:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    com.example.shortener: INFO
